# Mission Control with PostgreSQL.
#   docker compose up -d   → http://localhost (or https://$SITE_ADDRESS)
# Caddy is the only service exposed publicly; it serves the dashboard and
# proxies /api, /health and /ws to the backend.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-missionctl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-missionctl}
      POSTGRES_DB: ${POSTGRES_DB:-missioncontrol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-missionctl} -d ${POSTGRES_DB:-missioncontrol}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-missionctl}:${POSTGRES_PASSWORD:-missionctl}@db:5432/${POSTGRES_DB:-missioncontrol}
      BACKUP_DIR: /app/data/backups
    volumes:
      - ./backend/skills:/app/skills          # edit agents without rebuilding
      - ./workspace:/app/workspace:ro         # identity.md
      - backend-data:/app/data                # nightly backups
      - agent-workdir:/app/workdir
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"   # localhost only, for scripts/debugging
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - dashboard
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  backend-data:
  agent-workdir:
  caddy-data:
  caddy-config:
