# ============================================================
# Agent Skill Template
# ============================================================
# Copy this file and customize it to create a new agent.
# The agent's slug comes from its name ("Pulse (Reddit Scout)" -> pulse-reddit-scout).
# Files starting with "_" (like this one) are ignored.
#
# Place in the skills/ directory and restart the backend,
# or call the skill sync API endpoint to reload.
# ============================================================

name: my-agent
description: What this agent does in one sentence
version: "1.0"
type: general  # marketing, research, content, ops, general

# --- Identity & Persona ---
# These shape how the agent thinks and communicates.
# persona: Who this agent IS (role, personality, expertise)
# tone: How it communicates (warm, analytical, blunt, encouraging)
# If omitted, the agent gets a neutral default persona.
persona: A helpful assistant that provides clear, actionable advice
tone: professional and concise

# --- LLM Config ---
model: claude-haiku-4-5  # claude-haiku-4-5 (cheap/fast) or claude-sonnet-4-6 (smart)
max_budget_usd: 0.10     # max cost per run

# --- Tools this agent can use ---
# Available: web_search, bash, write
tools:
  - web_search

# --- Data Access ---
# What data this agent can read and write.
#   reads:  projects, tasks, notes, leads, marketing_content
#   writes: tasks (also covers leads), notes, marketing_content
data:
  reads: [projects, tasks]
  writes: [tasks]

# --- Schedule ---
# type: interval | cron | manual
# every: "4h", "30m", "1d" (for interval)
#        "0 9 * * *" (for cron — 9am daily)
schedule:
  type: manual

# --- Prompt Template ---
# Use {{variable}} for data injection. Available variables match data.reads:
#   {{projects}}          - JSON array of projects
#   {{tasks}}             - JSON array of open tasks (leads excluded)
#   {{notes}}             - JSON array of recent notes
#   {{leads}}             - JSON array of open leads
#   {{marketing_content}} - JSON array of content drafts
#   {{project}}           - JSON object of bound project (if project_id is set)
#
# NOTE: The agent's persona, user identity, and output format are
# injected automatically by the runner. Your prompt_template should
# focus on the TASK and DATA, not on identity setup.
prompt_template: |
  Here are the current projects:
  {{projects}}

  Here are the open tasks:
  {{tasks}}

  Analyze the situation and suggest improvements.

  Respond with JSON:
  {
    "summary": "What you found and recommend",
    "actions": [
      {"type": "create_task", "text": "...", "priority": "medium", "tags": ["tag"]},
      {"type": "update_task", "task_id": "...", "status": "done"},
      {"type": "create_note", "title": "...", "content": "markdown", "tags": ["tag"]},
      {"type": "create_lead", "title": "...", "body": "...", "url": "https://...", "source_type": "reddit", "relevance_score": 0.8},
      {"type": "create_content", "title": "...", "body": "...", "channel": "x", "task_id": "<lead id>"},
      {"type": "save_memory", "key": "...", "value": "..."},
      {"type": "handoff", "agent": "<teammate slug>", "request": "what they should do, with all the context", "task_id": "<related task id>"}
    ]
  }

# --- Constraints ---
requires_approval: false   # if true, actions queue for manual approval
max_actions_per_run: 10    # safety limit on DB writes per run
