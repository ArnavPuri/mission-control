# Mission Control on SQLite (no database container).
#   docker compose -f docker-compose.sqlite.yml up -d   → http://localhost

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      USE_SQLITE: "true"
      SQLITE_PATH: /app/data/mission_control.db
      BACKUP_DIR: /app/data/backups
    volumes:
      - ./backend/skills:/app/skills
      - ./workspace:/app/workspace:ro
      - backend-data:/app/data                # database + nightly backups
      - agent-workdir:/app/workdir
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - dashboard
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-data:
  agent-workdir:
  caddy-data:
  caddy-config:
